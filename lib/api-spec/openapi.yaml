openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Assence - Astrological Intelligence API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: readings
    description: Astrological readings
  - name: openai
    description: OpenAI chat operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /readings:
    get:
      operationId: listReadings
      tags: [readings]
      summary: List all readings
      responses:
        "200":
          description: List of readings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Reading"
    post:
      operationId: createReading
      tags: [readings]
      summary: Create a new astrological reading
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReadingBody"
      responses:
        "201":
          description: Reading created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reading"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /readings/{id}:
    get:
      operationId: getReading
      tags: [readings]
      summary: Get a reading by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Reading found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reading"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateReading
      tags: [readings]
      summary: Update notes on a reading
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateReadingBody"
      responses:
        "200":
          description: Updated reading
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reading"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteReading
      tags: [readings]
      summary: Delete a reading
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /readings/{id}/recalculate:
    post:
      operationId: recalculateReading
      tags: [readings]
      summary: Recalculate ephemeris for an existing reading
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecalculateReadingBody"
      responses:
        "200":
          description: Updated reading
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reading"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /readings/{id}/regenerate:
    post:
      operationId: regenerateReading
      tags: [readings]
      summary: Regenerate AI analysis for an existing reading
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated reading with new analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reading"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /readings/stats:
    get:
      operationId: getReadingsStats
      tags: [readings]
      summary: Get statistics about readings
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadingsStats"

  /openai/conversations:
    get:
      operationId: listConversations
      tags: [openai]
      summary: List conversations
      responses:
        "200":
          description: List of conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Conversation"
    post:
      operationId: createConversation
      tags: [openai]
      summary: Create a conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateConversationBody"
      responses:
        "201":
          description: Conversation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"

  /openai/conversations/{id}:
    get:
      operationId: getConversation
      tags: [openai]
      summary: Get conversation with messages
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationWithMessages"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /openai/conversations/{id}/messages:
    post:
      operationId: sendConversationMessage
      tags: [openai]
      summary: Send a message and stream AI response
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendOpenaiMessageBody"
      responses:
        "200":
          description: SSE stream
          content:
            text/event-stream:
              schema:
                type: string

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    PlanetPosition:
      type: object
      properties:
        sign:
          type: string
        house:
          type: integer
        degree:
          type: ["number", "null"]
        retrograde:
          type: ["boolean", "null"]
      required:
        - sign
        - house

    Aspect:
      type: object
      properties:
        planet1:
          type: string
        planet2:
          type: string
        type:
          type: string
        orb:
          type: ["number", "null"]
      required:
        - planet1
        - planet2
        - type

    HouseCusp:
      type: object
      properties:
        house:
          type: integer
        sign:
          type: string
        degrees:
          type: integer
        minutes:
          type: integer
      required:
        - house
        - sign

    BirthChart:
      type: object
      properties:
        ascendant:
          type: string
        midheaven:
          type: string
        sun:
          $ref: "#/components/schemas/PlanetPosition"
        moon:
          $ref: "#/components/schemas/PlanetPosition"
        mercury:
          $ref: "#/components/schemas/PlanetPosition"
        venus:
          $ref: "#/components/schemas/PlanetPosition"
        mars:
          $ref: "#/components/schemas/PlanetPosition"
        jupiter:
          $ref: "#/components/schemas/PlanetPosition"
        saturn:
          $ref: "#/components/schemas/PlanetPosition"
        uranus:
          $ref: "#/components/schemas/PlanetPosition"
        neptune:
          $ref: "#/components/schemas/PlanetPosition"
        pluto:
          $ref: "#/components/schemas/PlanetPosition"
        chiron:
          $ref: "#/components/schemas/PlanetPosition"
        lilith:
          $ref: "#/components/schemas/PlanetPosition"
        northNode:
          $ref: "#/components/schemas/PlanetPosition"
        southNode:
          $ref: "#/components/schemas/PlanetPosition"
        houseCusps:
          type: array
          items:
            $ref: "#/components/schemas/HouseCusp"
        aspects:
          type: array
          items:
            $ref: "#/components/schemas/Aspect"
      required:
        - ascendant
        - midheaven
        - sun
        - moon

    UpdateReadingBody:
      type: object
      properties:
        notes:
          type: ["string", "null"]

    CreateReadingBody:
      type: object
      properties:
        clientName:
          type: string
        birthDate:
          type: string
        birthTime:
          type: ["string", "null"]
        birthPlace:
          type: string
        birthChart:
          $ref: "#/components/schemas/BirthChart"
        autoCalculate:
          type: boolean
        clientAge:
          type: ["integer", "null"]
        notes:
          type: ["string", "null"]
        timezoneOverride:
          type: ["string", "null"]
          description: IANA timezone name (e.g. "UTC", "America/New_York"). If null, auto-detected from birth place coordinates.
      required:
        - clientName
        - birthDate
        - birthPlace

    RecalculateReadingBody:
      type: object
      properties:
        timezoneOverride:
          type: ["string", "null"]
          description: IANA timezone name override. If null, auto-detected from birth place coordinates.

    Reading:
      type: object
      properties:
        id:
          type: integer
        clientName:
          type: string
        birthDate:
          type: string
        birthTime:
          type: ["string", "null"]
        birthPlace:
          type: string
        birthChart:
          type: object
        analysis:
          type: ["string", "null"]
        analysisStatus:
          type: string
        clientAge:
          type: ["integer", "null"]
        notes:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - clientName
        - birthDate
        - birthPlace
        - birthChart
        - analysisStatus
        - createdAt
        - updatedAt

    ReadingsStats:
      type: object
      properties:
        total:
          type: integer
        completed:
          type: integer
        pending:
          type: integer
        thisMonth:
          type: integer
        mostCommonSunSign:
          type: ["string", "null"]
        mostCommonAscendant:
          type: ["string", "null"]
      required:
        - total
        - completed
        - pending
        - thisMonth

    Conversation:
      type: object
      properties:
        id:
          type: integer
        title:
          type: ["string", "null"]
        readingId:
          type: ["integer", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - createdAt
        - updatedAt

    CreateConversationBody:
      type: object
      properties:
        title:
          type: ["string", "null"]
        readingId:
          type: ["integer", "null"]

    Message:
      type: object
      properties:
        id:
          type: integer
        conversationId:
          type: integer
        role:
          type: string
        content:
          type: string
        createdAt:
          type: string
      required:
        - id
        - conversationId
        - role
        - content
        - createdAt

    ConversationWithMessages:
      type: object
      properties:
        id:
          type: integer
        title:
          type: ["string", "null"]
        readingId:
          type: ["integer", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string
        messages:
          type: array
          items:
            $ref: "#/components/schemas/Message"
      required:
        - id
        - createdAt
        - updatedAt
        - messages

    SendOpenaiMessageBody:
      type: object
      properties:
        content:
          type: string
      required:
        - content
